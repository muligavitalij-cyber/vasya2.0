<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Вася AI 2.1.70</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #111827;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      background: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
    }
    .icon-btn, .pill-btn {
      background: #ffffff;
      color: #111827;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 14px;
      cursor: pointer;
    }
    .icon-btn.listening {
      background: #fee2e2;
      border-color: #ef4444;
      color: #991b1b;
    }
    .model-select {
      flex: 1;
      max-width: 210px;
      background: #ffffff;
      color: #111827;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 14px;
    }

    .limit-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 12px;
      background: #f3f4f6;
      border-bottom: 1px solid #e5e7eb;
      font-size: 12px;
      color: #4b5563;
    }
    .tier-badge {
      padding: 2px 8px;
      border-radius: 999px;
      background: #ffffff;
      color: #111827;
      border: 1px solid #d1d5db;
      font-weight: 600;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 30;
    }
    .backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 80%;
      max-width: 320px;
      background: #ffffff;
      border-right: 1px solid #e5e7eb;
      transform: translateX(-100%);
      transition: transform 0.22s ease;
      z-index: 40;
      display: flex;
      flex-direction: column;
    }
    .sidebar.open {
      transform: translateX(0);
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid #e5e7eb;
      background: #f9fafb;
    }
    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      cursor: pointer;
      font-size: 14px;
      color: #111827;
    }
    .chat-item.active {
      background: #eff6ff;
      border-color: #93c5fd;
    }
    .chat-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .del-btn {
      background: transparent;
      border: none;
      color: #6b7280;
      font-size: 15px;
      cursor: pointer;
      padding: 0 4px;
    }

    .messages {
      flex: 1;
      padding: 14px 12px 96px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      background: #ffffff;
    }
    .msg {
      max-width: 92%;
      min-width: 0;
      padding: 11px 14px;
      border-radius: 14px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      word-break: break-word;
      font-size: 15px;
    }
    .msg.user {
      align-self: flex-end;
      background: #e8f0fe;
      color: #111827;
      border: 1px solid #c7dafc;
      white-space: pre-wrap;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #f9fafb;
      color: #111827;
      border: 1px solid #e5e7eb;
      white-space: normal;
      overflow-x: visible;
    }
    .msg-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .msg-author {
      font-weight: 700;
      color: #1d4ed8;
    }
    .speaking-badge {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1e40af;
      font-weight: 600;
      animation: speakPulse 1.2s infinite ease-in-out;
    }
    .speaking-badge.active {
      display: inline-flex;
    }
    @keyframes speakPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .msg.assistant > div,
    .msg.assistant p,
    .msg.assistant li,
    .msg.assistant h1,
    .msg.assistant h2,
    .msg.assistant h3,
    .msg.assistant h4 {
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .msg.assistant > :first-child {
      margin-top: 0;
    }
    .msg.assistant > :last-child {
      margin-bottom: 0;
    }
    .msg.assistant h1,
    .msg.assistant h2,
    .msg.assistant h3,
    .msg.assistant h4 {
      margin: 12px 0 6px;
      line-height: 1.3;
      color: #111827;
    }
    .msg.assistant h2 { font-size: 18px; }
    .msg.assistant h3 { font-size: 16px; }
    .msg.assistant p {
      margin: 0 0 8px;
    }
    .msg.assistant ul,
    .msg.assistant ol {
      margin: 4px 0 10px;
      padding-left: 20px;
    }
    .msg.assistant li {
      margin-bottom: 4px;
    }
    .msg.assistant code {
      background: #eef2f7;
      color: #111827;
      padding: 2px 5px;
      border-radius: 6px;
      font-size: 13.5px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .msg.assistant pre {
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 10px;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 8px 0;
    }
    .msg.assistant pre code {
      background: transparent;
      padding: 0;
      overflow-wrap: normal;
      word-break: normal;
    }
    .msg.assistant table {
      display: block;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-collapse: collapse;
      margin: 8px 0;
      font-size: 13.5px;
    }
    .msg.assistant th,
    .msg.assistant td {
      border: 1px solid #d1d5db;
      padding: 6px 9px;
      text-align: left;
      white-space: nowrap;
    }
    .msg.assistant th {
      background: #f3f4f6;
    }
    .msg img {
      display: block;
      max-width: 220px;
      max-height: 220px;
      border-radius: 10px;
      margin-bottom: 6px;
      border: 1px solid #e5e7eb;
    }
    .msg.assistant .reply-photos {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .msg.assistant .reply-photos img {
      max-width: 100%;
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      margin-bottom: 0;
    }

    .ai-disclaimer {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dashed #d1d5db;
      font-size: 11.5px;
      color: #6b7280;
    }
    .msg-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .msg-action-btn {
      background: #ffffff;
      color: #374151;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 12.5px;
      cursor: pointer;
    }
    .msg-action-btn.active-like {
      background: #dcfce7;
      border-color: #4ade80;
      color: #166534;
      font-weight: 600;
    }
    .msg-action-btn.active-dislike {
      background: #fee2e2;
      border-color: #f87171;
      color: #991b1b;
      font-weight: 600;
    }
    .msg-action-btn.active-speak {
      background: #dbeafe;
      border-color: #60a5fa;
      color: #1d4ed8;
      font-weight: 600;
    }

    .book-frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      line-height: 1.05;
      margin: 0 2px;
      font-size: 0.88em;
    }
    .book-frac-num {
      padding: 0 3px 1px 3px;
      border-bottom: 1.5px solid currentColor;
    }
    .book-frac-den {
      padding: 1px 3px 0 3px;
    }

    .composer-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #f9fafb;
      border-top: 1px solid #e5e7eb;
      z-index: 15;
    }
    .attachment-bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 12px 0;
      font-size: 12px;
      color: #374151;
    }
    .attachment-bar.active {
      display: flex;
    }
    .attachment-bar img {
      width: 34px;
      height: 34px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #d1d5db;
    }
    .clear-att-btn {
      background: #ffffff;
      color: #dc2626;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 2px 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .composer {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 12px;
    }
    .composer input[type="text"] {
      flex: 1;
      min-width: 0;
      background: #ffffff;
      color: #111827;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 15px;
      outline: none;
    }
    .composer input[type="text"]:focus {
      border-color: #2563eb;
    }
    .send-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 10px 13px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <button id="openSidebarBtn" class="icon-btn" type="button" aria-label="Відкрити чати">☰</button>
    <select id="modelSelect" class="model-select" aria-label="Вибір режиму або моделі">
      <option value="auto">Авто (ланцюжок)</option>
      <option value="study">Навчання / ДЗ</option>
      <option value="fast">Швидкий</option>
      <option value="smart">Смарт</option>
      <option value="pro">Про</option>
    </select>
    <button id="newChatBtn" class="pill-btn" type="button">+ Новий</button>
  </header>

  <div class="limit-bar">
    <span id="limitRemainingText">Ліміт: 250 / 250</span>
    <span id="requestEstimateBadge" class="tier-badge">Малий • 1 од.</span>
  </div>

  <div id="backdrop" class="backdrop"></div>

  <aside id="sidebar" class="sidebar" aria-label="Історія чатів">
    <div class="sidebar-header">
      <strong>Чати Васі</strong>
      <button id="closeSidebarBtn" class="icon-btn" type="button" aria-label="Закрити">✕</button>
    </div>
    <div id="chatList" class="chat-list"></div>
  </aside>

  <main id="messages" class="messages"></main>

  <div class="composer-wrap">
    <div id="attachmentBar" class="attachment-bar">
      <img id="attachmentThumb" alt="Прев'ю фото" />
      <span>Фото підготовлено для розбору</span>
      <button id="clearAttachmentBtn" class="clear-att-btn" type="button">Прибрати</button>
    </div>
    <form id="composerForm" class="composer">
      <label class="icon-btn" for="imageInput" title="Додати фото">+</label>
      <input id="imageInput" type="file" accept="image/*" hidden />
      <button id="micBtn" class="icon-btn" type="button" title="Голосовий ввід" aria-label="Голосовий ввід">🎤</button>
      <input id="messageInput" type="text" placeholder="Напиши або надиктуй Васі..." autocomplete="off" />
      <button id="sendBtn" class="send-btn" type="submit">Надіслати</button>
    </form>
  </div>

  <script>
    const STORAGE_KEY = "vasya_ai_2_1_70_chats";
    const DAILY_LIMIT = 250;
    const COSTS = { small: 1, medium: 3, large: 10 };

    const LARGE_RE = /(великий код|напиши код|напиши програму|напиши сайт|напиши скрипт|твір|есе|велике есе|доповідь|реферат|з нуля|архітектур|детальний розбір|повний код|багато коду)/i;
    const MEDIUM_RE = /(поясни|інформац|порівняй|приклади|як працює|зроби план|короткий код|фрагмент коду|виправ помилку|чому|навіщо|задача|дз|домашка|розв'яжи|розвяжи)/i;
    const STUDY_AUTO_RE = /(дз|домашн|домашка|задач|розв'яжи|розвяжи|обчисли|спрости|рівняння|дріб|дроби|формул|поясни тему|підготуй до)/i;

    const sidebar = document.getElementById("sidebar");
    const backdrop = document.getElementById("backdrop");
    const openSidebarBtn = document.getElementById("openSidebarBtn");
    const closeSidebarBtn = document.getElementById("closeSidebarBtn");
    const newChatBtn = document.getElementById("newChatBtn");
    const modelSelect = document.getElementById("modelSelect");
    const chatListEl = document.getElementById("chatList");
    const messagesEl = document.getElementById("messages");
    const composerForm = document.getElementById("composerForm");
    const messageInput = document.getElementById("messageInput");
    const imageInput = document.getElementById("imageInput");
    const micBtn = document.getElementById("micBtn");
    const attachmentBar = document.getElementById("attachmentBar");
    const attachmentThumb = document.getElementById("attachmentThumb");
    const clearAttachmentBtn = document.getElementById("clearAttachmentBtn");
    const limitRemainingText = document.getElementById("limitRemainingText");
    const requestEstimateBadge = document.getElementById("requestEstimateBadge");

    if (typeof marked !== "undefined") {
      marked.setOptions({
        breaks: true,
        gfm: true
      });
    }

    let state = loadState();
    let pendingImageBase64 = null;
    let speakingIndex = null;

    function todayUtc() {
      return new Date().toISOString().slice(0, 10);
    }

    function defaultState() {
      const firstId = "chat_" + Date.now();
      return {
        clientId: "u_" + Math.random().toString(36).slice(2, 10) + "_" + Date.now().toString(36),
        activeChatId: firstId,
        mode: "auto",
        usage: {
          day: todayUtc(),
          used: 0,
          limit: DAILY_LIMIT
        },
        chats: {
          [firstId]: {
            id: firstId,
            title: "Новий чат",
            messages: [
              {
                role: "assistant",
                text: "Привіт! Я Вася AI 2.1.70. Додав режим **Навчання / ДЗ**, голосовий ввід мікрофоном і акуратнішу роботу з фото задач.",
                photos: [],
                feedback: null
              }
            ]
          }
        }
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        if (!parsed.chats || !parsed.activeChatId || !parsed.chats[parsed.activeChatId]) {
          return defaultState();
        }
        if (!parsed.clientId) {
          parsed.clientId = "u_" + Math.random().toString(36).slice(2, 10);
        }
        if (!parsed.usage || parsed.usage.day !== todayUtc()) {
          parsed.usage = { day: todayUtc(), used: 0, limit: DAILY_LIMIT };
        }
        return parsed;
      } catch {
        return defaultState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch {}
    }

    function extractPhotoUrl(item) {
      if (!item) return "";
      if (typeof item === "string") return item.trim();
      if (typeof item === "object") {
        return String(
          item.image_url || item.url || item.webformatURL || item.largeImageURL || item.previewURL || ""
        ).trim();
      }
      return "";
    }

    function stopSpeech(shouldRender = true) {
      if ("speechSynthesis" in window) {
        try {
          window.speechSynthesis.cancel();
        } catch {}
      }
      speakingIndex = null;
      if (shouldRender) {
        renderMessages();
      }
    }

    function cleanForSpeech(rawText) {
      return String(rawText || "")
        .replace(/```[\s\S]*?```/g, " блок коду ")
        .replace(/[*_`~#<>|]/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function pickUkrainianVoice() {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      return (
        voices.find((v) => v.lang && v.lang.toLowerCase() === "uk-ua") ||
        voices.find((v) => v.lang && v.lang.toLowerCase().startsWith("uk")) ||
        null
      );
    }

    function toggleSpeakMessage(msgIndex, text) {
      if (!("speechSynthesis" in window)) {
        alert("Цей браузер не підтримує озвучування.");
        return;
      }

      const wasSpeakingThis = speakingIndex === msgIndex;
      stopSpeech(false);

      if (wasSpeakingThis) {
        renderMessages();
        return;
      }

      const cleaned = cleanForSpeech(text);
      if (!cleaned) {
        renderMessages();
        return;
      }

      const utterance = new SpeechSynthesisUtterance(cleaned);
      utterance.lang = "uk-UA";
      const uaVoice = pickUkrainianVoice();
      if (uaVoice) {
        utterance.voice = uaVoice;
      }

      speakingIndex = msgIndex;
      renderMessages();

      utterance.onend = () => {
        if (speakingIndex === msgIndex) {
          speakingIndex = null;
          renderMessages();
        }
      };
      utterance.onerror = () => {
        if (speakingIndex === msgIndex) {
          speakingIndex = null;
          renderMessages();
        }
      };

      try {
        window.speechSynthesis.speak(utterance);
      } catch {
        speakingIndex = null;
        renderMessages();
      }
    }

    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        pickUkrainianVoice();
      };
    }

    async function copyMessageText(text, btnEl) {
      const content = String(text || "");
      if (!content) return;
      try {
        await navigator.clipboard.writeText(content);
      } catch {
        const temp = document.createElement("textarea");
        temp.value = content;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        document.body.removeChild(temp);
      }
      if (btnEl) {
        const prev = btnEl.textContent;
        btnEl.textContent = "✅ Скопійовано";
        setTimeout(() => {
          btnEl.textContent = prev;
        }, 1400);
      }
    }
    function renderBookFractions(containerEl) {
      if (!containerEl) return;

      const walker = document.createTreeWalker(containerEl, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (!node.nodeValue || !node.nodeValue.includes("/")) {
            return NodeFilter.FILTER_REJECT;
          }
          const parent = node.parentElement;
          if (!parent || parent.closest("code, pre, .book-frac, a")) {
            return NodeFilter.FILTER_REJECT;
          }
          return NodeFilter.FILTER_ACCEPT;
        },
      });

      const textNodes = [];
      while (walker.nextNode()) {
        textNodes.push(walker.currentNode);
      }

      const fracRegex = /(^|[\s(=+\-×·÷≈<>])(\d{1,4})\s*\/\s*(\d{1,4})(?=[\s)=+\-×·÷≈<>.,;!?]|$)/g;

      for (const node of textNodes) {
        const text = node.nodeValue;
        fracRegex.lastIndex = 0;
        if (!fracRegex.test(text)) continue;

        fracRegex.lastIndex = 0;
        const frag = document.createDocumentFragment();
        let lastIndex = 0;
        let match;
        let changed = false;

        while ((match = fracRegex.exec(text)) !== null) {
          const prefix = match[1] || "";
          const num = match[2];
          const den = match[3];
          const matchStart = match.index;
          const fullMatch = match[0];

          const isLikelyDate =
            Number(num) >= 1 &&
            Number(num) <= 31 &&
            Number(den) >= 1 &&
            Number(den) <= 12 &&
            !/[=+\-×·÷≈]/.test(prefix);

          if (isLikelyDate) continue;

          changed = true;
          if (matchStart > lastIndex) {
            frag.appendChild(document.createTextNode(text.slice(lastIndex, matchStart)));
          }
          if (prefix) {
            frag.appendChild(document.createTextNode(prefix));
          }

          const span = document.createElement("span");
          span.className = "book-frac";

          const numEl = document.createElement("span");
          numEl.className = "book-frac-num";
          numEl.textContent = num;

          const denEl = document.createElement("span");
          denEl.className = "book-frac-den";
          denEl.textContent = den;

          span.appendChild(numEl);
          span.appendChild(denEl);
          frag.appendChild(span);

          lastIndex = matchStart + fullMatch.length;
        }

        if (changed) {
          if (lastIndex < text.length) {
            frag.appendChild(document.createTextNode(text.slice(lastIndex)));
          }
          node.parentNode.replaceChild(frag, node);
        }
      }
    }

    function updateAttachmentUi() {
      if (pendingImageBase64) {
        attachmentThumb.src = pendingImageBase64;
        attachmentBar.classList.add("active");
      } else {
        attachmentThumb.removeAttribute("src");
        attachmentBar.classList.remove("active");
      }
    }

    function optimizeImageFile(file, maxWidth = 1440, quality = 0.86) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const scale = img.width > maxWidth ? maxWidth / img.width : 1;
            const targetW = Math.max(1, Math.round(img.width * scale));
            const targetH = Math.max(1, Math.round(img.height * scale));
            const canvas = document.createElement("canvas");
            canvas.width = targetW;
            canvas.height = targetH;
            const ctx = canvas.getContext("2d");
            if (!ctx) {
              resolve(String(reader.result));
              return;
            }
            ctx.drawImage(img, 0, 0, targetW, targetH);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.src = String(reader.result);
        };
        reader.readAsDataURL(file);
      });
    }

    function resolveEffectiveMode(selectedMode, text, hasImage) {
      if (selectedMode !== "auto") return selectedMode;
      if (hasImage || STUDY_AUTO_RE.test(text || "")) return "study";
      return "auto";
    }

    function classifyLocal(text, hasImage) {
      const clean = (text || "").trim();
      if (LARGE_RE.test(clean) || clean.length >= 450) {
        return { tier: "large", label: "Великий", cost: COSTS.large };
      }
      if (hasImage || MEDIUM_RE.test(clean) || clean.length >= 90) {
        return { tier: "medium", label: "Середній", cost: COSTS.medium };
      }
      return { tier: "small", label: "Малий", cost: COSTS.small };
    }

    function updateLimitUi() {
      if (!state.usage || state.usage.day !== todayUtc()) {
        state.usage = { day: todayUtc(), used: 0, limit: DAILY_LIMIT };
      }
      const limit = state.usage.limit || DAILY_LIMIT;
      const used = state.usage.used || 0;
      const remaining = Math.max(0, limit - used);
      limitRemainingText.textContent = `Ліміт: ${remaining} / ${limit} од.`;

      const est = classifyLocal(messageInput.value, Boolean(pendingImageBase64));
      requestEstimateBadge.textContent = `${est.label} • ${est.cost} од.`;
    }

    function setSidebarOpen(isOpen) {
      sidebar.classList.toggle("open", isOpen);
      backdrop.classList.toggle("open", isOpen);
    }

    openSidebarBtn.addEventListener("click", () => setSidebarOpen(true));
    closeSidebarBtn.addEventListener("click", () => setSidebarOpen(false));
    backdrop.addEventListener("click", () => setSidebarOpen(false));

    let touchStartX = 0;
    let touchStartY = 0;

    document.addEventListener("touchstart", (e) => {
      if (!e.touches.length) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener("touchend", (e) => {
      if (!e.changedTouches.length) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;

      if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        if (dx > 0 && touchStartX < 55 && !sidebar.classList.contains("open")) {
          setSidebarOpen(true);
        } else if (dx < 0 && sidebar.classList.contains("open")) {
          setSidebarOpen(false);
        }
      }
    }, { passive: true });

    modelSelect.value = state.mode || "auto";
    modelSelect.addEventListener("change", () => {
      state.mode = modelSelect.value;
      saveState();
    });

    messageInput.addEventListener("input", updateLimitUi);

    clearAttachmentBtn.addEventListener("click", () => {
      pendingImageBase64 = null;
      imageInput.value = "";
      updateAttachmentUi();
      updateLimitUi();
    });

    newChatBtn.addEventListener("click", () => {
      stopSpeech(false);
      const id = "chat_" + Date.now();
      state.chats[id] = {
        id,
        title: "Новий чат",
        messages: []
      };
      state.activeChatId = id;
      saveState();
      renderAll();
      setSidebarOpen(false);
    });

    imageInput.addEventListener("change", async () => {
      const file = imageInput.files && imageInput.files[0];
      if (!file) {
        pendingImageBase64 = null;
        updateAttachmentUi();
        updateLimitUi();
        return;
      }
      try {
        pendingImageBase64 = await optimizeImageFile(file);
      } catch {
        pendingImageBase64 = null;
        alert("Не вдалося обробити фото.");
      }
      updateAttachmentUi();
      updateLimitUi();
    });

    const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecognizing = false;

    if (SpeechRecognitionCtor) {
      recognition = new SpeechRecognitionCtor();
      recognition.lang = "uk-UA";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isRecognizing = true;
        micBtn.classList.add("listening");
        micBtn.textContent = "⏹";
      };

      recognition.onresult = (event) => {
        const transcript = event.results?.[0]?.[0]?.transcript || "";
        if (transcript) {
          const current = messageInput.value.trim();
          messageInput.value = current ? `${current} ${transcript}` : transcript;
          updateLimitUi();
        }
      };

      recognition.onerror = (event) => {
        if (event.error === "not-allowed") {
          alert("Доступ до мікрофона заблоковано в браузері.");
        }
      };

      recognition.onend = () => {
        isRecognizing = false;
        micBtn.classList.remove("listening");
        micBtn.textContent = "🎤";
      };
    }

    micBtn.addEventListener("click", () => {
      if (!recognition) {
        alert("Голосовий ввід не підтримується цим браузером.");
        return;
      }
      if (isRecognizing) {
        recognition.stop();
      } else {
        try {
          recognition.start();
        } catch {}
      }
    });

    function renderChatList() {
      chatListEl.innerHTML = "";
      const ids = Object.keys(state.chats).reverse();
      for (const id of ids) {
        const chat = state.chats[id];
        const item = document.createElement("div");
        item.className = "chat-item" + (id === state.activeChatId ? " active" : "");

        const titleEl = document.createElement("span");
        titleEl.className = "chat-title";
        titleEl.textContent = chat.title || "Чат";
        titleEl.addEventListener("click", () => {
          stopSpeech(false);
          state.activeChatId = id;
          saveState();
          renderAll();
          setSidebarOpen(false);
        });

        const delBtn = document.createElement("button");
        delBtn.className = "del-btn";
        delBtn.type = "button";
        delBtn.textContent = "🗑";
        delBtn.title = "Видалити чат";
        delBtn.addEventListener("click", (ev) => {
          ev.stopPropagation();
          if (state.activeChatId === id) {
            stopSpeech(false);
          }
          delete state.chats[id];
          const remaining = Object.keys(state.chats);
          if (remaining.length === 0) {
            state = defaultState();
          } else if (state.activeChatId === id) {
            state.activeChatId = remaining[remaining.length - 1];
          }
          saveState();
          renderAll();
        });

        item.appendChild(titleEl);
        item.appendChild(delBtn);
        chatListEl.appendChild(item);
      }
    }

    function renderMessages() {
      messagesEl.innerHTML = "";
      const activeChat = state.chats[state.activeChatId];
      if (!activeChat) return;

      activeChat.messages.forEach((msg, idx) => {
        const bubble = document.createElement("div");
        bubble.className = "msg " + msg.role;

        if (msg.role === "assistant") {
          const meta = document.createElement("div");
          meta.className = "msg-meta";

          const author = document.createElement("span");
          author.className = "msg-author";
          author.textContent = "Вася";
          meta.appendChild(author);

          const speakingBadge = document.createElement("span");
          speakingBadge.className = "speaking-badge" + (speakingIndex === idx ? " active" : "");
          speakingBadge.textContent = "🔊 Говорить...";
          meta.appendChild(speakingBadge);

          bubble.appendChild(meta);
        }

        if (msg.image) {
          const img = document.createElement("img");
          img.src = msg.image;
          img.alt = "Прикріплене фото";
          bubble.appendChild(img);
        }

        if (msg.text) {
          if (msg.role === "assistant" && typeof marked !== "undefined") {
            const bodyDiv = document.createElement("div");
            bodyDiv.innerHTML = marked.parse(msg.text);
            renderBookFractions(bodyDiv);
            bubble.appendChild(bodyDiv);
          } else {
            const span = document.createElement("span");
            span.textContent = msg.text;
            bubble.appendChild(span);
          }
        }

        if (msg.role === "assistant" && Array.isArray(msg.photos) && msg.photos.length > 0) {
          const photosWrap = document.createElement("div");
          photosWrap.className = "reply-photos";
          for (const item of msg.photos) {
            const url = extractPhotoUrl(item);
            if (!url) continue;
            const pImg = document.createElement("img");
            pImg.src = url;
            pImg.alt = (typeof item === "object" && item && (item.alt || item.query)) || "Фото з Pixabay";
            pImg.loading = "lazy";
            photosWrap.appendChild(pImg);
          }
          if (photosWrap.childElementCount > 0) {
            bubble.appendChild(photosWrap);
          }
        }

        const isThinkingPlaceholder = msg.role === "assistant" && msg.text === "Думаю...";
        if (msg.role === "assistant" && !isThinkingPlaceholder) {
          const disclaimer = document.createElement("div");
          disclaimer.className = "ai-disclaimer";
          disclaimer.textContent = "Вася — це ШІ і може помилятися. Перевіряй важливі деталі.";
          bubble.appendChild(disclaimer);

          const actions = document.createElement("div");
          actions.className = "msg-actions";

          const copyBtn = document.createElement("button");
          copyBtn.type = "button";
          copyBtn.className = "msg-action-btn";
          copyBtn.textContent = "📋 Копіювати";
          copyBtn.addEventListener("click", () => copyMessageText(msg.text, copyBtn));

          const likeBtn = document.createElement("button");
          likeBtn.type = "button";
          likeBtn.className = "msg-action-btn" + (msg.feedback === "like" ? " active-like" : "");
          likeBtn.textContent = "👍";
          likeBtn.addEventListener("click", () => {
            msg.feedback = msg.feedback === "like" ? null : "like";
            saveState();
            renderMessages();
          });

          const dislikeBtn = document.createElement("button");
          dislikeBtn.type = "button";
          dislikeBtn.className = "msg-action-btn" + (msg.feedback === "dislike" ? " active-dislike" : "");
          dislikeBtn.textContent = "👎";
          dislikeBtn.addEventListener("click", () => {
            msg.feedback = msg.feedback === "dislike" ? null : "dislike";
            saveState();
            renderMessages();
          });

          const speakBtn = document.createElement("button");
          const isSpeakingThis = speakingIndex === idx;
          speakBtn.type = "button";
          speakBtn.className = "msg-action-btn" + (isSpeakingThis ? " active-speak" : "");
          speakBtn.textContent = isSpeakingThis ? "⏹ Стоп" : "🔊 Звук";
          speakBtn.addEventListener("click", () => toggleSpeakMessage(idx, msg.text));

          actions.appendChild(copyBtn);
          actions.appendChild(likeBtn);
          actions.appendChild(dislikeBtn);
          actions.appendChild(speakBtn);
          bubble.appendChild(actions);
        }

        messagesEl.appendChild(bubble);
      });

      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderAll() {
      renderChatList();
      renderMessages();
      updateAttachmentUi();
      updateLimitUi();
    }

    composerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (isRecognizing && recognition) {
        recognition.stop();
      }
      const text = messageInput.value.trim();
      const imageToSend = pendingImageBase64;
      if (!text && !imageToSend) return;

      const est = classifyLocal(text, Boolean(imageToSend));
      const limit = (state.usage && state.usage.limit) || DAILY_LIMIT;
      const used = (state.usage && state.usage.used) || 0;
      if (est.cost > Math.max(0, limit - used)) {
        alert(`Не вистачає ліміту: потрібно ${est.cost} од., залишилось ${Math.max(0, limit - used)} од.`);
        return;
      }

      stopSpeech(false);

      const activeChat = state.chats[state.activeChatId];
      if (activeChat.title === "Новий чат" && text) {
        activeChat.title = text.slice(0, 32);
      }

      activeChat.messages.push({
        role: "user",
        text,
        image: imageToSend || null
      });

      const thinkingMsg = { role: "assistant", text: "Думаю...", photos: [], feedback: null };
      activeChat.messages.push(thinkingMsg);
      saveState();
      renderAll();

      messageInput.value = "";
      imageInput.value = "";
      pendingImageBase64 = null;
      updateAttachmentUi();
      updateLimitUi();

      const effectiveMode = resolveEffectiveMode(modelSelect.value, text, Boolean(imageToSend));

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            model_mode: effectiveMode,
            image: imageToSend,
            client_id: state.clientId,
            history: activeChat.messages.slice(-8, -1).map((m) => ({
              role: m.role,
              content: m.text || ""
            }))
          })
        });
        const data = await res.json();
        thinkingMsg.text = data.reply || data.response || data.error || "Порожня відповідь від сервера.";
        thinkingMsg.photos = Array.isArray(data.photos) ? data.photos : [];

        if (typeof data.used === "number" && typeof data.limit === "number") {
          state.usage = {
            day: todayUtc(),
            used: data.used,
            limit: data.limit
          };
        }
      } catch {
        thinkingMsg.text = "Не вдалося з'єднатися з сервером.";
        thinkingMsg.photos = [];
      }

      saveState();
      renderAll();
    });

    renderAll();
  </script>
</body>
</html>
